name: CI

on:
  push:
    branches: [ dev/plasmashell-safety, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        qt: [ 'qt6' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt update
          sudo apt install -y cmake g++ libkf5config-dev libkf5coreaddons-dev \
            libkf5i18n-dev libkf5plasma-dev qt6-base-dev qt6-declarative-dev-tools libmpv-dev

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: |
          cd build
          cmake --build . -j$(nproc)

      - name: Run CTest
        run: |
          cd build
          QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      - name: Run QML tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          if command -v qmltestrunner >/dev/null; then
            find tests -name "*.qml" -exec qmltestrunner {} \; | head -30
          else
            echo "qmltestrunner not found, skipping QML tests"
          fi

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plasma-wallpaper-engine
          path: |
            build/*.so
            build/arch/*.pkg.tar.zst
